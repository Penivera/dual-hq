[package]
name = "internship-api"
version = "0.1.0"
edition = "2021"
default-run = "internship-api"


[[bin]]
name = "internship-api"
path = "src/main.rs"

[dependencies]
# Web framework & server
axum = { version = "0.8.1", features = ["macros"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br", "timeout"] }

# Database & ORM
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros", "with-chrono", "schema-sync"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
sea-orm-pro = "0.1.0"

# Serialization & validation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
async-graphql = { version = "7.0", features = ["chrono"] }

# Security & Auth
jsonwebtoken = "9.3"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }

# OpenAPI & Swagger UI
utoipa = { version = "5.3", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Configuration & Environment
dotenvy = "0.15"
config = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Email & Mailing
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
askama = "0.12"

