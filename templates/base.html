<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Internship Portal{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f6f9fc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #333333;
            line-height: 1.6;
        }
        .wrapper {
            max-width: 600px;
            margin: 24px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
        }
        .header {
            background: linear-gradient(135deg, #1890ff 0%, #0050b3 100%);
            padding: 24px;
            text-align: center;
            color: #ffffff;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .content {
            padding: 32px 28px;
        }
        .content h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 20px;
        }
        .button {
            display: inline-block;
            padding: 12px 28px;
            background-color: #1890ff;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin: 20px 0;
            text-align: center;
        }
        .button-success {
            background-color: #52c41a;
        }
        .card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 18px;
            margin: 20px 0;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .badge-success {
            background-color: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .token-box {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 16px;
            letter-spacing: 1px;
            margin: 16px 0;
            text-align: center;
            word-break: break-all;
        }
        .footer {
            background-color: #fafafa;
            border-top: 1px solid #f0f0f0;
            padding: 20px 24px;
            text-align: center;
            font-size: 12px;
            color: #8c8c8c;
        }
        .footer p {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>Internship Portal</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 Internship Application Portal. All rights reserved.</p>
            <p>This is an automated notification, please do not reply directly to this email.</p>
        </div>
    </div>
</body>
</html>
