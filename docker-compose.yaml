services:
  web:
    image: ghcr.io/penivera/dual-hq:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dual_hq_web
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "8000"
    ports:
      - "${PORT:-8000}:8000"
    labels:
      - traefik.docker.network=coolify
    environment:
      - SERVICE_TYPE=web
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@internship.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_NAME=${ADMIN_NAME:-Admin User}
      - RUST_LOG=${RUST_LOG:-internship_api=info,tower_http=info}
    networks:
      - coolify
    volumes:
      - ./logs:/app/logs

networks:
  coolify:
    external: true
