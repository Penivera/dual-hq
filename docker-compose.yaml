services:
  api:
    image: ghcr.io/penivera/dual-hq:latest
    pull_policy: always
    container_name: dual_hq_api
    restart: unless-stopped
    ports:
      - "8010:8010"
    labels:
      - traefik.docker.network=coolify
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SERVER_PORT=8010
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_ENABLED=${SMTP_ENABLED}
      - APP_BASE_URL=${APP_BASE_URL}
    networks:
      - coolify
    volumes:
      - ./logs:/app/logs

networks:
  coolify:
    external: true
